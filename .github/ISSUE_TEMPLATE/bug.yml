name: Tester bug report
description: Something broke while testing NoGoon
labels: [tester-report, fix]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 7, Android 15
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which blocked app or site triggered it (if any)?
  - type: input
    id: version
    attributes:
      label: NoGoon version (Settings, bottom of screen)

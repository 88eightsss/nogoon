name: Task for Claude
description: A small, clear job the nightly Claude routine can do alone
labels: [claude-ok]
body:
  - type: textarea
    id: task
    attributes:
      label: What to do
      description: One job. Say which files or screens if you know.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: Type-check passes and the Journal saves entries to Supabase.

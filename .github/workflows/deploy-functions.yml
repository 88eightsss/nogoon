# Deploys Supabase edge functions that changed on master, with the same JWT flags as scripts/deploy-backend.ps1.
# Manual run: Actions -> Deploy functions -> Run workflow (type a name, or "all").
# Database migrations are NOT applied here on purpose; run them yourself.
name: Deploy functions
on:
  push:
    branches: [master]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names separated by spaces, or "all"'
        required: true
        default: all
env:
  PROJECT_REF: hadcagughbyouagwpdhq
  NO_JWT: 'event-submit events-draft feed-daily health local-news supporter-sweep supporter-webhook wall-webhook'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret not set; skipping deploy."; echo "SKIP=1" >> $GITHUB_ENV; fi
      - name: Work out which functions
        if: env.SKIP != '1'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIST="${{ github.event.inputs.functions }}"
          else
            LIST=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
          fi
          if [ "$LIST" = "all" ] || echo "$LIST" | grep -qw "_shared"; then
            LIST=$(ls supabase/functions | grep -v '^_' | tr '\n' ' ')
          fi
          echo "FUNCS=$LIST" >> $GITHUB_ENV
          echo "Deploying: $LIST"
      - name: Deploy
        if: env.SKIP != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in $FUNCS; do
            [ -d "supabase/functions/$f" ] || continue
            FLAG=""
            if echo " $NO_JWT " | grep -q " $f "; then FLAG="--no-verify-jwt"; fi
            echo "== $f $FLAG"
            npx --yes supabase@2.109.1 functions deploy "$f" --project-ref "$PROJECT_REF" $FLAG
          done
